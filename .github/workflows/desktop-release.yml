name: Release Desktop (Windows & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew || true
        shell: bash

      - name: Build Windows Packages
        run: .\gradlew :desktop:packageMsi :desktop:packageExe :desktop:packageUberJarForCurrentOS

      - name: Collect Windows Binaries & Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Get-ChildItem -Path desktop/build/compose/binaries/main/msi/*.msi, desktop/build/compose/binaries/main/exe/*.exe, desktop/build/compose/jars/*.jar | ForEach-Object {
            Copy-Item $_.FullName -Destination dist-windows/
          }
          cd dist-windows
          Get-ChildItem -File -Exclude "*.txt" | Get-FileHash -Algorithm SHA256 | Out-File -Encoding utf8 SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist-windows/*

  build-linux:
    name: Build Linux (DEB & RPM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Linux Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm wget file

      - name: Make gradlew and scripts executable
        run: |
          chmod +x ./gradlew
          chmod +x packaging/appimage/build-appimage.sh

      - name: Build Linux Native Packages (DEB & RPM)
        run: ./gradlew :desktop:packageDeb :desktop:packageRpm :desktop:packageUberJarForCurrentOS

      - name: Build Standalone Universal AppImage
        run: ./packaging/appimage/build-appimage.sh || echo "AppImage build skipped or non-fatal"

      - name: Collect Linux Binaries & Checksums
        run: |
          mkdir -p dist-linux
          find desktop/build/compose/binaries/main -type f \( -name "*.deb" -o -name "*.rpm" \) -exec cp {} dist-linux/ \;
          find desktop/build/compose/jars -type f -name "*.jar" -exec cp {} dist-linux/ \;
          cp packaging/scripts/pdfchemy.sh dist-linux/ || true
          if [ -f "PDFchemy-x86_64.AppImage" ]; then
            cp PDFchemy-x86_64.AppImage dist-linux/
          fi
          cd dist-linux
          sha256sum $(find . -maxdepth 1 -type f ! -name "*.txt") > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist-linux/*

  publish-release:
    name: Publish Official Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets/

      - name: Generate Consolidated Checksums & Manifest
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          cd release-assets
          rm -f SHA256SUMS*.txt
          echo "# VERSION=${{ github.ref_name }}" > SHA256SUMS.txt
          echo "# PLATFORM=Desktop" >> SHA256SUMS.txt
          echo "# ARCH=Universal" >> SHA256SUMS.txt
          sha256sum * >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          
          echo "Signing SHA256SUMS.txt..."
          echo "$UPDATE_PRIVATE_KEY" > private.pem
          
          # Check if the private key was provided and valid
          if [ -s private.pem ] && grep -q "BEGIN" private.pem; then
            openssl pkeyutl -sign -inkey private.pem -rawin -in SHA256SUMS.txt | base64 -w 0 > SHA256SUMS.txt.sig
            echo "Signature generated successfully."
          else
            echo "WARNING: UPDATE_PRIVATE_KEY secret is missing or invalid. Signature will not be generated."
          fi
          
          rm -f private.pem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          name: PDFchemy Tools Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## PDFchemy Tools Desktop Release ${{ github.ref_name }}
            
            100% offline, privacy-focused document utility for Windows and Linux.
            
            ### Downloads
            - **Windows Installer:** `.msi` / `.exe`
            - **Linux Packages:** `.deb` (Debian/Ubuntu/Mint), `.rpm` (Fedora/RHEL)
            - **Standalone Executable:** Portable `.jar`
            
            ### Verification
            Verify all downloads against `SHA256SUMS.txt`.

      - name: Attest Build Provenance (Immutable Release)
        uses: actions/attest-build-provenance@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: 'release-assets/*'

      - name: Archive Older Releases (Make Private)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all public releases except the one we just published
          tags=$(gh release list --exclude-drafts --json tagName -q ".[].tagName" | grep -v "^${{ github.ref_name }}$" || true)
          for tag in $tags; do
            if [ -n "$tag" ]; then
              echo "Marking older release $tag as draft (private)..."
              gh release edit "$tag" --draft
            fi
          done
