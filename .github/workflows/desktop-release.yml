name: Release Desktop (Windows & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew || true
        shell: bash

      - name: Build Windows Packages
        run: .\gradlew :desktop:packageMsi :desktop:packageExe :desktop:packageUberJarForCurrentOS

      - name: Collect Windows Binaries & Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Get-ChildItem -Recurse -Include *.msi,*.exe,*.jar desktop/build/compose | ForEach-Object {
            Copy-Item $_.FullName -Destination dist-windows/
          }
          cd dist-windows
          Get-FileHash -Algorithm SHA256 * | Out-File -Encoding utf8 SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist-windows/*

  build-linux:
    name: Build Linux (DEB & RPM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Linux Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Linux Packages
        run: ./gradlew :desktop:packageDeb :desktop:packageRpm

      - name: Collect Linux Binaries & Checksums
        run: |
          mkdir -p dist-linux
          find desktop/build/compose -type f \( -name "*.deb" -o -name "*.rpm" \) -exec cp {} dist-linux/ \;
          cd dist-linux
          sha256sum * > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist-linux/*

  publish-release:
    name: Publish Official Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets/

      - name: Generate Consolidated Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          name: PDFchemy Tools Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## PDFchemy Tools Desktop Release ${{ github.ref_name }}
            
            100% offline, privacy-focused document utility for Windows and Linux.
            
            ### Downloads
            - **Windows Installer:** `.msi` / `.exe`
            - **Linux Packages:** `.deb` (Debian/Ubuntu/Mint), `.rpm` (Fedora/RHEL)
            - **Standalone Executable:** Portable `.jar`
            
            ### Verification
            Verify all downloads against `SHA256SUMS.txt`.
