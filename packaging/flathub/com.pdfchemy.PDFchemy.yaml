app-id: com.pdfchemy.PDFchemy
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: pdfchemy

finish-args:
  # X11 & Wayland access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Audio/Notifications
  - --socket=pulseaudio
  # Local filesystem access for opening/saving documents
  - --filesystem=host:ro
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # No network access required! (100% offline security)
  # - --share=network (Deliberately omitted: PDFchemy is 100% offline!)

build-options:
  env:
    JAVA_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21
    PATH: /usr/lib/sdk/openjdk21/bin:/app/bin:/usr/bin

modules:
  - name: pdfchemy
    buildsystem: simple
    build-commands:
      - install -D -m 755 -d /app/bin /app/lib/pdfchemy /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/metainfo
      - cp -r desktop/build/compose/binaries/main/app/* /app/lib/pdfchemy/
      - ln -s /app/lib/pdfchemy/bin/pdfchemy /app/bin/pdfchemy
      - install -D -m 644 desktop/src/main/resources/linux/com.pdfchemy.PDFchemy.desktop /app/share/applications/com.pdfchemy.PDFchemy.desktop
      - install -D -m 644 desktop/src/main/resources/icons/linux/icon.png /app/share/icons/hicolor/512x512/apps/com.pdfchemy.PDFchemy.png
      - install -D -m 644 desktop/src/main/resources/linux/com.pdfchemy.PDFchemy.metainfo.xml /app/share/metainfo/com.pdfchemy.PDFchemy.metainfo.xml
    sources:
      - type: dir
        path: .
