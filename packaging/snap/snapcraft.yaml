name: pdfchemy
base: core22
version: '1.0.0'
summary: Fast, local-first offline emergency PDF utility for the people
description: |
  PDFchemy Tools is a 100% offline, privacy-first emergency document utility built for the people.
  All processing executes completely on your machine with zero cloud uploads and zero telemetry.

  Developer Manifesto:
  "Lifetime of updates until I personally die and free of charge; and all you have to do is make
  a solid valid request and it will be done and implemented; cuz it's from the people to the people..."
  — Andrei Ioan Cucoș (John), Developer

  Key Features:
  • Visual Page Studio: Reorder, rotate, delete, and duplicate pages with instant visual cards.
  • Smart Target Compressor: Fit documents under strict portal size budgets (e.g. under 2MB).
  • Images ⇄ PDF Studio: Compile photos into PDFs or extract all pages as high-res PNG images.
  • Multi-Core Batch Queue: Process 50+ PDFs simultaneously across all CPU cores.
  • Document Security: 128/256-bit AES encryption and password removal.

grade: stable
confinement: strict

architectures:
  - build-on: amd64

apps:
  pdfchemy:
    command: usr/lib/pdfchemy/bin/pdfchemy
    desktop: usr/share/applications/com.pdfchemy.PDFchemy.desktop
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - wayland
      - x11
      - opengl
      - audio-playback

parts:
  desktop-app:
    plugin: nil
    build-packages:
      - openjdk-21-jdk
    override-build: |
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      ./gradlew :desktop:createDistributable
      
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/lib/pdfchemy
      cp -r desktop/build/compose/binaries/main/app/* $SNAPCRAFT_PART_INSTALL/usr/lib/pdfchemy/
      
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/applications
      cp desktop/src/main/resources/linux/com.pdfchemy.PDFchemy.desktop $SNAPCRAFT_PART_INSTALL/usr/share/applications/
      
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps
      cp desktop/src/main/resources/icons/linux/icon.png $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/com.pdfchemy.PDFchemy.png
